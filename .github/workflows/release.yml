name: Release

on:
  push:
    tags:
      - "v*"
  # One-click release from the Actions tab: pick a tag, hit Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out tether-ai
        uses: actions/checkout@v4
        with:
          path: tether-ai

      - name: Require TETHER_RUNTIME_TOKEN
        env:
          TETHER_RUNTIME_TOKEN: ${{ secrets.TETHER_RUNTIME_TOKEN }}
        run: |
          if [ -z "$TETHER_RUNTIME_TOKEN" ]; then
            echo "::error::Missing secret TETHER_RUNTIME_TOKEN. Add a PAT that can read private repo tt-11-dd/tether-runtime (Contents: Read), then re-run."
            exit 1
          fi

      # Agent core lives in a sibling private repo. GITHUB_TOKEN cannot read
      # other private repos — set secret TETHER_RUNTIME_TOKEN (PAT with
      # Contents: Read on tt-11-dd/tether-runtime). Default branch is `dev`.
      - name: Check out tether-runtime
        uses: actions/checkout@v4
        with:
          repository: tt-11-dd/tether-runtime
          ref: dev
          path: tether-runtime
          token: ${{ secrets.TETHER_RUNTIME_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            tether-ai/pnpm-lock.yaml
            tether-runtime/pnpm-lock.yaml

      - name: Set up Go (Windows sandbox helper)
        if: matrix.target == 'win'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install tether-runtime dependencies
        working-directory: tether-runtime
        # Remote lockfile sometimes drifts from patchedDependencies in
        # pnpm-workspace.yaml; don't block releases on that mismatch.
        run: pnpm install --no-frozen-lockfile

      - name: Build tether-agent-core
        working-directory: tether-runtime/packages/core
        run: |
          pnpm build
          if [ "${{ matrix.target }}" = "win" ]; then
            pnpm build:windows-sandbox
          fi

      - name: Install tether-ai dependencies
        working-directory: tether-ai
        run: pnpm install --frozen-lockfile

      - name: Link tether-agent-core
        working-directory: tether-ai
        run: pnpm core:link

      - name: Build desktop app
        working-directory: tether-ai
        run: pnpm build:electron && pnpm build:renderer

      - name: Pack installer
        working-directory: tether-ai
        env:
          # Use the ad-hoc identity from electron-builder.yml; skip keychain discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --${{ matrix.target }}

      # Only ship the two installers — never blockmap / yaml / unpacked dirs.
      - name: Stage release assets
        id: stage
        working-directory: tether-ai
        run: |
          mkdir -p release-upload
          if [ "${{ matrix.target }}" = "mac" ]; then
            cp release/*.dmg release-upload/
          else
            cp release/*.exe release-upload/
          fi
          ls -la release-upload
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Tether ${{ steps.stage.outputs.version }}
          files: tether-ai/release-upload/*
          fail_on_unmatched_files: true
          body: |
            ## Downloads
            - macOS (Apple Silicon): `Tether-${{ steps.stage.outputs.version }}-arm64.dmg`
            - Windows (x64): `Tether-Setup-${{ steps.stage.outputs.version }}.exe`

            ## Notes
            - Local-first AI coding workbench
            - Supports DeepSeek and custom OpenAI-compatible endpoints
            - If macOS says the app can't be opened, right-click → Open, or run:
              `xattr -cr /Applications/Tether.app`

            Feedback: https://github.com/tt-11-dd/tether-ai/issues
